<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wasm-pdf-reader — React demo</title>
<link rel="stylesheet" href="../dist/styles.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; margin: 0; }
  body { background: #0d1117; color: #e6edf3; font: 14px/1.45 system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; }
  .reader { min-width: 0; min-height: 0; display: flex; }
  .reader > .wpdf-root { flex: 1; }
  .side { border-left: 1px solid #21262d; padding: 16px; overflow: auto; background: #0f141b; }
  .side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; margin: 18px 0 8px; }
  .side h2:first-child { margin-top: 0; }
  .side dl { display: grid; grid-template-columns: 70px 1fr; gap: 4px 8px; margin: 0; font-size: 13px; }
  .side dt { color: #8b949e; }
  .side dd { margin: 0; overflow-wrap: anywhere; }
  .side pre { white-space: pre-wrap; font-size: 12px; color: #adbac7; background: #161b22; border: 1px solid #21262d;
              border-radius: 8px; padding: 10px; max-height: 46vh; overflow: auto; }
  .hint { color: #8b949e; font-size: 12px; }
  .badge { position: absolute; right: 12px; bottom: 12px; background: #58a6ff; color: #04121f;
           font: 600 11px/1 system-ui; padding: 6px 8px; border-radius: 6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
